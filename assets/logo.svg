<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 40" width="140" height="40" role="img" aria-label="backseat">
  <!-- mark: a back seat, with remarks flying off it (danmaku) -->
  <g fill="currentColor">
    <rect x="17" y="6" width="7" height="23" rx="3.5"/>
    <rect x="5" y="26" width="19" height="7" rx="3.5"/>
    <rect x="1" y="9" width="11" height="3.4" rx="1.7" opacity="0.55"/>
    <rect x="5" y="15.3" width="7.5" height="3.4" rx="1.7" opacity="0.35"/>
  </g>
  <!-- wordmark -->
  <text x="36" y="27" fill="currentColor"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="21" font-weight="600" letter-spacing="-0.6">backseat</text>
</svg>
